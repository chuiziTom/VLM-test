# WeVisOne-VL inference environment (micromamba)
#
# Validated on:
#   Linux x86_64, NVIDIA RTX PRO 6000 Blackwell Workstation Edition (sm_120),
#   driver 580.178.04 (CUDA 13.0), 94.96 GiB VRAM.
#
# Notes:
#   - Python 3.12 is required in practice: the official pins matplotlib==3.11.0
#     (>=3.11) and scipy==1.18.1 (>=3.12), although pyproject.toml says >=3.10.
#   - torch==2.11.0 from PyPI on Linux is the CUDA 13.0 build (2.11.0+cu130).
#   - triton==3.6.0 is a hard transitive dependency of torch 2.11.0, NOT the
#     optional vLLM stack. vLLM and Gradio are intentionally not installed.
#   - The nvidia-* pip packages are Linux x86_64 only. For macOS/CPU-only,
#     remove them and install the matching CPU/other-platform torch build.
#   - The project itself is installed separately (non-editable):
#       cd models/WeVisOne-VL && python -m pip install . --no-deps
#
name: wevisone-vl
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip=26.2.2
  - packaging=26.3
  - wheel=0.48.0
  - pip:
      - Jinja2==3.1.6
      - MarkupSafe==3.0.4
